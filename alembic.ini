[alembic]
script_location = migrations
prepend_sys_path = .

# No sqlalchemy.url here on purpose: the URL is built from POSTGRES_* env
# vars by ledger_sense/store/session.py and set programmatically in
# migrations/env.py, so no connection string (and no password) is ever
# checked into this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
