# .github/workflows/ci.yml
name: ci
on: [push, pull_request]
jobs:
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Native-layer check (shared objects resolving outside the venv)
        run: |
          # Fail on any shared object an installed extension module resolves OUTSIDE the venv.
          # This is a deny-list *supplement*, not full coverage: it only catches an ELF
          # extension module that dynamic-links to something outside .venv/system libs at
          # import time; a subprocess-invoked binary (e.g. ocrmypdf shelling out to
          # `gs`) is caught by NATIVE_DENY instead, by name, not by this scan. See
          # docs/methodology.md for what this does and does not cover.
          find .venv -name '*.so' -exec ldd {} + \
            | awk '/=>/ {print $3}' | sort -u \
            | grep -v -e '^\.venv' -e '^/lib' -e '^/usr/lib' -e 'linux-vdso' \
            | tee /dev/stderr | wc -l | grep -qx 0
      - run: uv run python -m scripts.licence_audit --check-lockfile uv.lock
      - run: uv run pytest tests/test_licence_audit.py -v

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_sense
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: ledger_sense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_sense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/store/test_migrations.py runs the SQLite path unconditionally
      # and, when this is set, additionally applies the same migration to
      # this service container — the one place in CI that proves the schema
      # alembic builds is the schema Postgres actually accepts, not just
      # SQLite plus an offline DDL render.
      LEDGER_SENSE_LIVE_POSTGRES_URL: postgresql+psycopg://ledger_sense:changeme@localhost:5432/ledger_sense
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy --strict .
      - run: uv run pytest
      - name: Coverage floor (domain, rules/arithmetic, baseline)
        run: |
          uv run pytest tests/domain tests/rules/arithmetic tests/baseline \
            --cov=ledger_sense.domain --cov=ledger_sense.rules.arithmetic \
            --cov=ledger_sense.baseline --cov-report=term-missing --cov-fail-under=75

  no-float:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run python -m scripts.check_no_float
      - run: uv run mypy --strict ledger_sense

  aia-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run python -m scripts.aia_guard

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
      # F-28: VCR scrubs request headers and bodies, never responses.
      - run: gitleaks detect --no-git --source tests/writeback/cassettes --redact

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      # `next build` typechecks the app as it compiles, so this is the type
      # gate too — the frontend's equivalent of `mypy --strict`.
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pip-audit --strict
      - run: npm audit --audit-level=high
      - run: uv run cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
