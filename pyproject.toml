[project]
name = "ledger-sense"
version = "0.1.0"
description = "Document intelligence with confidence routing, for construction progress billing."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Berakhah", email = "77killuazoldic@gmail.com" }
]
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pypdfium2>=5.13.0",
    "sqlalchemy>=2.0.52",
]

# No [project.scripts]: no CLI. Dev entrypoint is `uv run python -m ledger_sense`.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
]

[tool.uv]
# Application, not a distributable library: no wheel to build/install. uv
# manages the dependency-only venv; modules are imported straight off
# pythonpath below.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# pypdfium2 ships no py.typed marker / stubs.
module = "pypdfium2.*"
ignore_missing_imports = true
