[project]
name = "ledger-sense"
version = "0.1.0"
description = "Document intelligence with confidence routing, for construction progress billing."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Berakhah", email = "77killuazoldic@gmail.com" }
]
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "pydantic>=2.4.0",
    "psycopg[binary]>=3.3.4",
    "pypdfium2>=5.13.0",
    "sqlalchemy>=2.0.52",
]

# No [project.scripts]: no CLI. Dev entrypoint is `uv run python -m ledger_sense`.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
# Application, not a distributable library: no wheel to build/install. uv
# manages the dependency-only venv; modules are imported straight off
# pythonpath below.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# tests/test_no_floats.py Layer 3/4 bodies are copied verbatim from the plan
# (Task 3): the import-alias, nested-if and broad-except style there is the
# brief's exact test text, not this repo's normal style.
"tests/test_no_floats.py" = ["PLR0402", "SIM102", "S110", "BLE001", "I001"]
# tests/baseline/test_study.py is copied verbatim from the plan (Task 10):
# its import block is the brief's exact test text, not this repo's normal
# import-sort order.
"tests/baseline/test_study.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests/ has no __init__.py (pytest doesn't need one); without this, mypy
# names every file solely by its basename and tests/store/conftest.py
# collides with tests/api/conftest.py under the bare module name "conftest".
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# pypdfium2 ships no py.typed marker / stubs.
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The no-float test bodies are copied verbatim from the plan (Task 3): they
# lean on pytest's untyped tmp_path convention and are exercised, not typed,
# by design. Everything else in the repo stays under strict def checking.
module = "tests.test_no_floats"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# tests/baseline/test_study.py (Task 10) is copied verbatim from the plan:
# its test functions and the _study() helper are untyped by design there too,
# and the test functions call that untyped helper, so both checks relax.
module = "tests.baseline.test_study"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# tests/baseline/test_report.py (Task 11) is the same shape as test_study.py
# above, copied verbatim from the plan: an untyped _study() helper called by
# untyped test functions.
module = "tests.baseline.test_report"
disallow_untyped_defs = false
disallow_untyped_calls = false
