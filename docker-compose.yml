# docker-compose.yml
#
# Two profiles, `client` and `demo` (spec §2.1 Q6):
#   client — CLIENT_CONFIDENTIAL data. Postgres is always the container
#            below with a named volume; never a hosted service, so
#            "your documents never leave your infrastructure" stays true.
#   demo   — SYNTHETIC data only. Postgres is ephemeral (tmpfs), mounts no
#            client volume, hostable anywhere.
#
# `docker compose --profile demo up` or `docker compose --profile client up`.

# Everything the API service is regardless of profile. The two services below
# differ in exactly one thing — LEDGER_SENSE_PROFILE — so it is worth seeing
# that difference on its own rather than diffing two copies of this block.
x-app: &app
  build:
    context: .
  # 00 §8: this service parses hostile, untrusted PDFs.
  read_only: true
  tmpfs:
    - /tmp
    - /app/scratch
  mem_limit: 1g          # judgment call — not pinned by the brief
  cpus: "1.0"             # judgment call — not pinned by the brief
  security_opt:
    - no-new-privileges:true
  env_file:
    - .env
  ports:
    - "8000:8000"
  # Only one of these two exists per profile; `required: false` lets app
  # depend on "whichever Postgres this profile started" without compose
  # erroring on the other, out-of-profile service name.
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    postgres-demo:
      condition: service_healthy
      required: false
  # /api/health only starts answering once __main__.py's migration step has
  # already succeeded and uvicorn is serving — so "healthy" here means "ready
  # for a real request", which `web`'s own depends_on (below) leans on. No
  # curl in python:3.12-slim; urllib is always there.
  healthcheck:
    test: ["CMD", "python", "-c",
           "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

x-postgres-env: &postgres-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-ledger_sense}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  POSTGRES_DB: ${POSTGRES_DB:-ledger_sense}

services:
  # Two API services rather than one parameterised by an env var, for the same
  # reason there are two Postgres services: which profile you are running must
  # be a property of what compose started, not of what someone remembered to
  # export. LEDGER_SENSE_PROFILE=demo is what mounts POST /api/fixtures/seed —
  # a route that mints documents — so "I meant to run the demo" must not be a
  # way to get it in front of real ones.
  app:
    <<: *app
    profiles: ["client"]
    environment:
      <<: *postgres-env
      LEDGER_SENSE_PROFILE: client
      # Substituted here, not left to env_file's plain pass-through of .env:
      # an unset *or empty* .env value must still resolve to the default —
      # env_file alone would hand the container a literal empty string,
      # which is a real (if useless) CORS allow-list entry, not "unset".
      LEDGER_SENSE_WEB_ORIGIN: ${LEDGER_SENSE_WEB_ORIGIN:-http://localhost:3000}
      LEDGER_SENSE_BLOB_ROOT: /var/lib/ledger-sense/blobs
    volumes:
      # The KEK in .env is what makes this volume ciphertext, not the volume
      # itself — back the two up separately (docs/security.md).
      - client_blobs:/var/lib/ledger-sense/blobs

  app-demo:
    <<: *app
    # Same hostname as `app`, so `web`'s API URL resolves under either profile;
    # only one of the two is ever on the network at once.
    hostname: app
    profiles: ["demo"]
    environment:
      <<: *postgres-env
      LEDGER_SENSE_PROFILE: demo
      LEDGER_SENSE_WEB_ORIGIN: ${LEDGER_SENSE_WEB_ORIGIN:-http://localhost:3000}
      # Already tmpfs via the x-app anchor's /app/scratch mount — SYNTHETIC
      # data, ephemeral by design, same stance as postgres-demo.
      LEDGER_SENSE_BLOB_ROOT: /app/scratch/blobs

  # The Next.js app. Root build context on purpose: one package.json and one
  # lockfile serve the whole node side, and the app directory is passed to
  # next as its project directory.
  web:
    build:
      context: .
      dockerfile: ledger_sense/web/Dockerfile
      args:
        # Passed through to the Dockerfile's ARG of the same name, which the
        # `environment:` entry below cannot reach: Next.js inlines
        # NEXT_PUBLIC_* into the client bundle at `next build` time, before
        # the container this `environment:` block configures ever starts.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    profiles: ["client", "demo"]
    # Same `required: false` pattern as app's own depends_on: only one of the
    # two API services exists per profile.
    depends_on:
      app:
        condition: service_healthy
        required: false
      app-demo:
        condition: service_healthy
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    profiles: ["client"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger_sense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_sense}
    volumes:
      - client_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # app's depends_on above waits on this: pg_isready ships in the image
    # already, so this is the one Postgres accepts connections check, not
    # merely "the container process started" (which "created subdirectories"
    # can be true for well before Postgres is actually ready for a client).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger_sense}"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-demo:
    image: postgres:16-alpine
    # Same hostname as the `client` profile's `postgres` service, so `app`'s
    # POSTGRES_HOST default (`postgres`) resolves under either profile —
    # only one of the two Postgres services is ever on the network at once.
    hostname: postgres
    profiles: ["demo"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger_sense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_sense}
    tmpfs:
      - /var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger_sense}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  client_pgdata:
  client_blobs:
